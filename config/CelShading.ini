; =====================================================================
;  CelShading.ini  -  Cel Shading + Outline untuk GTA San Andreas (AML)
;
;  File ini dibaca ulang otomatis kira-kira tiap 1-2 detik saat game
;  berjalan: ubah nilai, simpan, lalu lihat hasilnya langsung.
;  Baris berawalan ; atau # adalah komentar.
; =====================================================================

[CelShading]

; Nyalakan / matikan seluruh efek.  1 = nyala, 0 = mati
Enabled = 1

; ------------------------- CEL SHADING -------------------------------
; Jumlah tingkat terang-gelap. Makin kecil makin tegas/kartun.  (2 - 16)
ShadeBands = 5

; Kehalusan peralihan antar pita. 0.01 = tajam, 1 = sangat halus.  (0.01 - 1)
BandSoftness = 0.15

; Kecerahan minimum area tergelap supaya bayangan tidak hitam pekat.  (0 - 0.6)
ShadowFloor = 0.10

; Saturasi warna. 1 = asli, di atas 1 = lebih mencolok.  (0 - 3)
Saturation = 1.20

; Pengali kecerahan akhir.  (0.3 - 2)
Brightness = 1.00

; Posterisasi warna per-kanal (palet terbatas). 0 = mati, 1 = penuh.  (0 - 1)
ColorPosterize = 0.00

; Jumlah level per kanal untuk posterisasi.  (2 - 32)
ColorLevels = 6

; ---------------------------- OUTLINE --------------------------------
; Nyalakan garis tepi.  1 = nyala, 0 = mati
Outline = 1

; Tebal garis, dalam piksel pada layar setinggi 720 (otomatis diskalakan
; ke resolusi layar kamu).  (0.25 - 6)
OutlineWidth = 1.0

; Ambang kontras warna. Kecil = banyak garis (termasuk detail tekstur),
; besar = hanya tepi objek yang jelas.  (0 - 2)
; Muncul bintik/garis berlebihan di tekstur?  Naikkan ke 0.30.
; Garis di tepi objek kurang?  Turunkan ke 0.14.
OutlineThreshold = 0.20

; Kelembutan tepi garis.  (0.01 - 1)
OutlineSoftness = 0.12

; Kepekatan garis. 1 = penuh.  (0 - 1)
OutlineStrength = 1.00

; Warna garis: R G B, masing-masing 0 - 255.  (0 0 0 = hitam)
OutlineColor = 0 0 0

; Kualitas deteksi tepi.  1 = bagus (Sobel, 8 sampel)  0 = cepat (4 sampel)
; Pakai 0 kalau FPS turun di HP kamu.
Quality = 1

; --------------------------- LANJUTAN --------------------------------
; Mode tuning: 0 = normal, 1 = tampilkan hanya peta garis (putih = tanpa garis),
; 2 = tampilkan cel shading saja tanpa garis.
DebugView = 0

; Pustaka game yang di-hook. Hanya ubah kalau game-nya bukan GTA SA
; (butuh restart game agar berlaku).
GameLibrary = libGTASA.so
